name: 2 - Build Release AAB (Play Store)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -f upload-keystore.p12 || { echo "upload-keystore.p12 नहीं मिली। पहले '1 - Create upload key' चलाइए।"; exit 1; }
          test -n "$KS_PASS" || { echo "KEYSTORE_PASSWORD secret नहीं मिला।"; exit 1; }
      - name: Capacitor project
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p cap/www && cd cap
          echo '<!doctype html><title>Task Tandav</title><p>Loading...</p>' > www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/android@7 @capacitor-community/admob@7 @capacitor-firebase/authentication@7 firebase@11
          npm i -D @capacitor/cli@7
          cat > capacitor.config.json <<'CFG'
          {
            "appId": "com.tasktandav.app",
            "appName": "Task Tandav",
            "webDir": "www",
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "useCredentialManager": false,
                "providers": ["google.com"]
              }
            },
            "server": {
              "url": "https://maheshbairw00-alt.github.io/task-tandav/",
              "cleartext": false,
              "allowNavigation": ["maheshbairw00-alt.github.io", "accounts.google.com", "*.googleapis.com", "*.firebaseapp.com", "*.google.com", "*.gstatic.com"]
            }
          }
          CFG
          npx cap add android
          if [ -f ../google-services.json ]; then cp ../google-services.json android/app/google-services.json; echo GS-OK; else echo GS-MISSING; fi
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          npx cap sync android
          # संस्करण संख्या: हर बिल्ड पर बढ़ती हुई (Play Store को हर अपलोड पर नई चाहिए)
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          # Release पर दस्तख़त (signing)
          sed -i 's#^\(\s*\)release {#\1release {\n\1    signingConfig signingConfigs.release#' android/app/build.gradle
          sed -i "s#^android {#android {\n    signingConfigs {\n        release {\n            storeFile file('$GITHUB_WORKSPACE/upload-keystore.p12')\n            storePassword System.getenv('KS_PASS')\n            keyAlias 'tasktandav'\n            keyPassword System.getenv('KS_PASS')\n        }\n    }#" android/app/build.gradle
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7586210928508782~7997282110"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "versionCode\|signingConfig" android/app/build.gradle
      - name: Build release AAB
        working-directory: cap/android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TaskTandav-release-AAB
          path: cap/android/app/build/outputs/bundle/release/app-release.aab
