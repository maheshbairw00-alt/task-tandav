name: Build Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Capacitor project
        run: |
          mkdir -p cap/www && cd cap
          echo '<!doctype html><title>Task Tandav</title><p>Loading...</p>' > www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/android@7 @capacitor-community/admob@7 @capacitor-firebase/authentication@7 firebase@11
          npm i -D @capacitor/cli@7
          cat > capacitor.config.json <<'CFG'
          {
            "appId": "com.tasktandav.app",
            "appName": "Task Tandav",
            "webDir": "www",
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "useCredentialManager": false,
                "providers": ["google.com"]
              }
            },
            "server": {
              "url": "https://maheshbairw00-alt.github.io/task-tandav/",
              "cleartext": false,
              "allowNavigation": ["maheshbairw00-alt.github.io", "accounts.google.com", "*.googleapis.com", "*.firebaseapp.com", "*.google.com", "*.gstatic.com"]
            }
          }
          CFG
          npx cap add android
          mkdir -p ~/.android && cp ../tt-debug.keystore ~/.android/debug.keystore
          if [ -f ../google-services.json ]; then cp ../google-services.json android/app/google-services.json; echo GS-OK; else echo GS-MISSING; fi
          npx cap sync android
          sed -i 's#</application>#    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7586210928508782~7997282110"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "APPLICATION_ID" android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: cap/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TaskTandav-debug-apk
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Show APK signing key
        run: |
          keytool -printcert -jarfile cap/android/app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA1|SHA-1"
          npm ls @capacitor-firebase/authentication --prefix cap
          grep -rn "default_web_client_id" cap/android/app/build/generated/res/google-services/debug/values/values.xml || true
